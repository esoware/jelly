[graph]
targets = [
  "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin", "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
# Only direct dependencies are checked. The unmaintained transitive ones (gtk3
# through tauri on Linux, and paste through alloy-primitives) have no upgrade
# path from here.
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "monero-ed25519 0.1.0 pins crypto-bigint 0.5 and has no release on the fixed 0.7 line yet" },
]

[licenses]
# about.toml accepts the same licenses, and apps/wallet/notices.ts allows them for npm
# packages, so keep the three lists in step.
allow = [
  "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MITNFA", "MPL-2.0",
  "Unicode-3.0", "Unlicense", "Zlib",
]
# Anyone can rebuild the app from its source against a modified copy of either, which
# is what the LGPL asks of a binary that links them.
exceptions = [
  { crate = "nacl", allow = ["LGPL-3.0-or-later"] },
  { crate = "jelly_tron", allow = ["LGPL-3.0-only"] },
]

# nacl declares the deprecated LGPL-3.0+ identifier.
[[licenses.clarify]]
crate = "nacl"
expression = "LGPL-3.0-or-later"
license-files = [{ path = "LICENSE", hash = 0xdb3c2abe }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# reqwest's rustls-no-provider feature links rustls-platform-verifier and
# rustls-native-certs, but nothing constructs them. jelly_net gives
# tls_backend_preconfigured a ClientConfig with only the webpki roots.
deny = [
  { name = "aws-lc-rs" },
  { name = "aws-lc-sys" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
# monero-oxide publishes monero-seed from git only.
allow-git        = ["https://github.com/monero-oxide/monero-wallet-util"]
