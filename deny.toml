[graph]
targets = [
  "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin", "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
# Only direct dependencies are checked. The unmaintained transitive ones (gtk3
# through tauri on Linux, and paste through alloy-primitives) have no upgrade
# path from here.
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "monero-ed25519 0.1.0 pins crypto-bigint 0.5 and has no release on the fixed 0.7 line yet" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# reqwest's rustls-no-provider feature links rustls-platform-verifier and
# rustls-native-certs, but nothing constructs them. jelly_net gives
# tls_backend_preconfigured a ClientConfig with only the webpki roots.
deny = [
  { name = "aws-lc-rs" },
  { name = "aws-lc-sys" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  { name = "reqwest", wrappers = ["jelly_net"] },
  { name = "rustls", wrappers = ["jelly_net", "reqwest", "hyper-rustls", "tokio-rustls", "rustls-platform-verifier"] },
  { name = "jelly_store", wrappers = ["jelly_engine"] },
  # jelly_utxo and jelly_evm take their chains as dev-dependencies of their tests, and
  # jelly_solana, jelly_tron, and jelly_monero are dev-dependencies of themselves to
  # turn on their test-util feature.
  { name = "jelly_bitcoin", wrappers = ["jelly_chains", "jelly_utxo"] },
  { name = "jelly_litecoin", wrappers = ["jelly_chains", "jelly_utxo"] },
  { name = "jelly_dogecoin", wrappers = ["jelly_chains", "jelly_utxo"] },
  { name = "jelly_bitcoin_cash", wrappers = ["jelly_chains", "jelly_utxo"] },
  { name = "jelly_zcash", wrappers = ["jelly_chains"] },
  { name = "jelly_ethereum", wrappers = ["jelly_chains", "jelly_evm"] },
  { name = "jelly_arbitrum", wrappers = ["jelly_chains", "jelly_evm"] },
  { name = "jelly_base", wrappers = ["jelly_chains", "jelly_evm"] },
  { name = "jelly_optimism", wrappers = ["jelly_chains", "jelly_evm"] },
  { name = "jelly_bsc", wrappers = ["jelly_chains", "jelly_evm"] },
  { name = "jelly_polygon", wrappers = ["jelly_chains", "jelly_evm"] },
  { name = "jelly_avalanche", wrappers = ["jelly_chains", "jelly_evm"] },
  { name = "jelly_solana", wrappers = ["jelly_chains", "jelly_solana"] },
  { name = "jelly_tron", wrappers = ["jelly_chains", "jelly_tron"] },
  { name = "jelly_xrp", wrappers = ["jelly_chains"] },
  { name = "jelly_ton", wrappers = ["jelly_chains"] },
  { name = "jelly_monero", wrappers = ["jelly_chains", "jelly_monero"] },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
# monero-oxide publishes monero-seed from git only.
allow-git        = ["https://github.com/monero-oxide/monero-wallet-util"]
