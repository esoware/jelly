[graph]
targets = [
  "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin", "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
# Flags only unmaintained direct dependencies. Transitive ones such as gtk3 through
# tauri on Linux and paste through alloy-primitives have no upgrade path from here.
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "monero-ed25519 0.1.0 pins crypto-bigint 0.5, and no monero-ed25519 release moves to the fixed 0.7 yet" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# rustls-platform-verifier and rustls-native-certs aren't banned because reqwest's
# rustls-no-provider feature links them. jelly_net never constructs them and hands
# tls_backend_preconfigured a ClientConfig with only the webpki roots.
deny = [
  { name = "aws-lc-rs" },
  { name = "aws-lc-sys" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
# monero-oxide publishes monero-seed from git only.
allow-git        = ["https://github.com/monero-oxide/monero-wallet-util"]
