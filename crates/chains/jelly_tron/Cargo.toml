[package]
name         = "jelly_tron"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish      = false

[lints]
workspace = true

[features]
default = []
# The adapter's test seams, and the fixtures both test suites share. Enable only
# from [dev-dependencies].
test-util = []

[dependencies]
jelly_core    = { workspace = true }
jelly_keypair = { workspace = true }
jelly_net     = { workspace = true }

alloy-primitives = { workspace = true }
alloy-sol-types  = { workspace = true }

async-trait = { workspace = true }
bs58        = { workspace = true }
hex         = { workspace = true }
parking_lot = { workspace = true }
prost       = { workspace = true }
prost-types = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
zeroize     = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
protox      = { workspace = true }

[dev-dependencies]
jelly_core       = { workspace = true, features = ["test-util"] }
jelly_keypair    = { workspace = true, features = ["test-util"] }
jelly_net        = { workspace = true, features = ["test-util"] }
jelly_tron       = { workspace = true, features = ["test-util"] }
tokio            = { workspace = true, features = ["io-util", "net", "test-util"] }
