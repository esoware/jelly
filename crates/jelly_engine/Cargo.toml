[package]
name         = "jelly_engine"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish      = false

[lints]
workspace = true

[features]
default = []
ipc = ["dep:specta", "jelly_core/ipc"]
# Fixtures, fakes, and test seams into stored state, sessions, sync loops, and the event
# pump. Enable only from [dev-dependencies].
test-util = ["jelly_core/test-util"]

[dependencies]
jelly_core     = { workspace = true }
jelly_keypair  = { workspace = true }
jelly_mnemonic = { workspace = true }
jelly_store    = { workspace = true }
jelly_vault    = { workspace = true }

arc-swap    = { workspace = true }
async-trait = { workspace = true }
hex         = { workspace = true }
hmac        = { workspace = true }
parking_lot = { workspace = true }
secrecy     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }
specta      = { workspace = true, optional = true }
tempfile    = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tokio-util  = { workspace = true }
tracing     = { workspace = true }
zeroize     = { workspace = true }

[dev-dependencies]
jelly_chains  = { workspace = true }
jelly_core    = { workspace = true, features = ["test-util"] }
jelly_engine  = { workspace = true, features = ["test-util"] }
jelly_net     = { workspace = true, features = ["test-util"] }
jelly_vault   = { workspace = true, features = ["test-util"] }
jelly_keypair = { workspace = true, features = ["test-util"] }
tokio         = { workspace = true, features = ["test-util"] }
