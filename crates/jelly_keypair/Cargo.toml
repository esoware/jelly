[package]
name         = "jelly_keypair"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish      = false

[lints]
workspace = true

[features]
default = []
# The all-abandon test keychain, Seed::from_bytes, and uncompressed WIFs, which other
# crates' tests use. Enable only from [dev-dependencies].
test-util = []

[dependencies]
jelly_core = { workspace = true }

aes              = { workspace = true }
bitcoin          = { workspace = true }
ctr              = { workspace = true }
curve25519-dalek = { workspace = true }
ed25519-dalek    = { workspace = true }
hex              = { workspace = true }
hmac             = { workspace = true }
pbkdf2           = { workspace = true }
scrypt           = { workspace = true }
secp256k1        = { workspace = true }
secrecy          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
sha2             = { workspace = true }
sha3             = { workspace = true }
subtle           = { workspace = true }
zeroize          = { workspace = true }

[dev-dependencies]
jelly_core = { workspace = true, features = ["test-util"] }
jelly_keypair = { workspace = true, features = ["test-util"] }

alloy-primitives = { workspace = true }
proptest         = { workspace = true }
