# Licenses a crate or npm package the app ships may be under, most preferred first for one
# that offers a choice. apps/wallet/notices.ts parses this list for the npm packages, so keep
# comments out of it. The targets match deny.toml.
accepted = [
  "MIT", "Apache-2.0", "0BSD", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MITNFA", "MPL-2.0", "Unicode-3.0",
  "Unlicense", "Zlib",
]
targets = [
  "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin", "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# LGPL: the source is public, so anyone can relink against a modified nacl.
[nacl]
accepted = ["LGPL-3.0-or-later"]
