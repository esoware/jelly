packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2

minimumReleaseAge: 10080
# pnpm installs a younger version only when no older one satisfies the range asked for, such
# as the fixed version in a Renovate security PR.
minimumReleaseAgeStrict: false
trustPolicy: no-downgrade
