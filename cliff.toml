[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
footer = """

Each file is attested to the workflow that built it. Verify a download with `gh attestation verify <file> --repo esoware/jelly`.
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# A breaking commit of any type is one that existing installs migrate for, so it leads the notes.
commit_parsers = [
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
