name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only PR runs cancel. Main runs save the cache, and a release needs CI on its exact commit, so
# each one gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ready:
    name: Ready on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-2025-vs2026
          - os: macOS
            runner: macos-26
          - os: Linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # The runner can't provide a Secret Service.
      - name: Start a Secret Service
        if: runner.os == 'Linux'
        run: |
          address=$(dbus-daemon --session --fork --print-address)
          echo "DBUS_SESSION_BUS_ADDRESS=$address" >> "$GITHUB_ENV"
          echo -n ci | DBUS_SESSION_BUS_ADDRESS=$address gnome-keyring-daemon --unlock --components=secrets

      - name: Run just ready
        run: just ready

      - name: Fail if just ready changed or added a file
        run: git add --all && git diff --cached --exit-code

      # just test skips this test because it writes to the developer's own credential store.
      - name: Run the keychain test
        timeout-minutes: 5
        run: just test --run-ignored only the_platform_store_round_trips_the_master_key
