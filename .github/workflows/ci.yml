name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runs on main save the Rust cache that PR runs read, so only PR runs cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ready:
    name: Ready on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-2025-vs2026
          - os: macOS
            runner: macos-26
          - os: Linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The vault's keychain test needs a Secret Service, and a runner has no desktop
      # session to provide one.
      - name: Start a Secret Service
        if: runner.os == 'Linux'
        run: |
          address=$(dbus-daemon --session --fork --print-address)
          echo "DBUS_SESSION_BUS_ADDRESS=$address" >> "$GITHUB_ENV"
          echo -n ci | DBUS_SESSION_BUS_ADDRESS=$address gnome-keyring-daemon --unlock --components=secrets

      - name: Run just ready
        run: just ready

      - name: Fail if just ready changed or added a file
        run: git add --all && git diff --cached --exit-code
