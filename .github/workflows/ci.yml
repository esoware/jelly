name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runs on main save the Rust cache that PR runs read, so only PR runs cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ready:
    name: Ready on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-latest
          - os: macOS
            runner: macos-latest
          - os: Linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: just,cargo-nextest,cargo-deny

      - name: Run just ready
        if: runner.os != 'Linux'
        run: just ready

      # The vault's keychain test needs a Secret Service, and a runner has no desktop
      # session to provide one.
      - name: Run just ready with a Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends gnome-keyring
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets && just ready'

      - name: Fail if just ready changed a file
        run: git diff --exit-code
