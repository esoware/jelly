name: PR title

# The title becomes the squash commit's subject, which git-cliff reads for the release notes.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Check the PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if the title doesn't follow CONTRIBUTING.md
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|build|ci|chore|revert)\([a-z0-9_]+(,[a-z0-9_]+)*\)!?: [a-z].*[^.]$'
          if [[ ! $TITLE =~ $pattern ]] || [ ${#TITLE} -gt 72 ]; then
            echo "::error::The title isn't type(scope): subject in 72 characters or fewer, as CONTRIBUTING.md describes."
            exit 1
          fi
