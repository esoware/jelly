name: Setup
description: Install the Linux build dependencies, the frontend packages, the pinned Rust toolchain, and cargo tools.

inputs:
  rust-cache:
    description: Restores the Rust build cache, and saves it from runs on main.
    default: "true"
  tools:
    description: Comma-separated tools for taiki-e/install-action.
    required: true

runs:
  using: composite
  steps:
    - name: Install the Linux build and bundling dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libdbus-1-dev librsvg2-dev patchelf

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install the frontend packages
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install the Rust toolchain
      shell: bash
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.rust-cache == 'true'
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: ${{ inputs.tools }}
