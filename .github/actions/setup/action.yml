name: Setup
description: Install the Linux build dependencies, the frontend packages, the pinned Rust toolchain, and cargo tools.

inputs:
  rust-cache:
    description: Restores the Rust build cache, and saves it from runs on main.
    default: "true"
  tools:
    description: Comma-separated tools for taiki-e/install-action.
    required: true

runs:
  using: composite
  steps:
    # The runners' Ubuntu mirror sometimes serves at tens of kB/s, so the .deb files carry over from
    # earlier runs on main. apt still checks each one against the signed package index.
    - name: Restore the Linux packages
      if: runner.os == 'Linux'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives/*.deb
        key: apt-${{ runner.arch }}-${{ github.run_id }}
        restore-keys: apt-${{ runner.arch }}-

    - name: Install the Linux build and bundling dependencies
      id: apt
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p ~/apt-archives/partial
        count_debs() { find ~/apt-archives -maxdepth 1 -name '*.deb' | wc -l; }
        before=$(count_debs)
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          -o Dir::Cache::Archives="$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true \
          libwebkit2gtk-4.1-dev libdbus-1-dev librsvg2-dev patchelf
        if [ "$(count_debs)" != "$before" ]; then
          echo "downloaded=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save the Linux packages
      if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.apt.outputs.downloaded == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives/*.deb
        key: apt-${{ runner.arch }}-${{ github.run_id }}

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install the frontend packages
      shell: bash
      run: pnpm install --frozen-lockfile

    # rust-cache keys on every installed toolchain, and runner images differ in which stable
    # toolchain they ship, so only the pinned one stays.
    - name: Install the Rust toolchain
      shell: bash
      run: |
        rustup toolchain install
        pinned=$(rustup show active-toolchain | cut -d ' ' -f 1)
        for toolchain in $(rustup toolchain list --quiet); do
          if [ "$toolchain" != "$pinned" ]; then
            rustup toolchain uninstall "$toolchain"
          fi
        done

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.rust-cache == 'true'
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: ${{ inputs.tools }}
